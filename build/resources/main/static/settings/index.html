<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <title>설정 | 스테이북</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/">스테이북</a>
    <nav id="header-nav" class="header-nav" aria-label="계정"></nav>
  </header>

  <main class="info-page">
    <h1>설정</h1>
    <p class="page-sub">계정과 알림, 서비스 이용 환경을 관리합니다.</p>

    <section class="info-card" aria-labelledby="account-title">
      <h2 id="account-title">계정</h2>
      <p class="card-sub">회원 정보 변경은 로그인 후 이용할 수 있습니다.</p>
      <ul class="link-list">
        <li><span class="link-disabled">회원 정보 수정 (준비 중)</span></li>
        <li><span class="link-disabled">비밀번호 변경 (준비 중)</span></li>
        <li><a href="/booking/my.html">내 예약</a></li>
      </ul>
    </section>

    <section class="info-card" aria-labelledby="notify-title">
      <h2 id="notify-title">알림</h2>
      <p class="card-sub">받고 싶은 알림을 선택하세요.</p>

      <div class="setting-row">
        <label class="setting-text" for="notify-booking">
          <span>예약 알림</span>
          <span>예약 접수·승인·취소 결과를 알려 드립니다.</span>
        </label>
        <span class="switch">
          <input id="notify-booking" type="checkbox" data-setting="notifyBooking">
          <span aria-hidden="true"></span>
        </span>
      </div>
      <div class="setting-row">
        <label class="setting-text" for="notify-marketing">
          <span>마케팅 정보 수신</span>
          <span>할인·이벤트 소식을 받아 봅니다.</span>
        </label>
        <span class="switch">
          <input id="notify-marketing" type="checkbox" data-setting="notifyMarketing">
          <span aria-hidden="true"></span>
        </span>
      </div>
    </section>

    <section class="info-card" aria-labelledby="general-title">
      <h2 id="general-title">일반</h2>
      <p class="card-sub">서비스 이용 환경을 설정합니다.</p>

      <div class="setting-row">
        <label class="setting-text" for="setting-language">
          <span>언어</span>
          <span>화면에 표시할 언어</span>
        </label>
        <select id="setting-language" class="setting-select" data-setting="language">
          <option value="ko">한국어</option>
        </select>
      </div>
      <div class="setting-row">
        <label class="setting-text" for="setting-sort">
          <span>숙소 기본 정렬</span>
          <span>숙소 목록을 처음 열 때의 정렬 순서</span>
        </label>
        <select id="setting-sort" class="setting-select" data-setting="defaultSort">
          <option value="recommended">추천순</option>
          <option value="priceAsc">낮은 가격순</option>
          <option value="priceDesc">높은 가격순</option>
          <option value="rating">평점순</option>
        </select>
      </div>

      <p id="settings-saved" class="settings-saved" role="status" hidden></p>
    </section>

    <section class="info-card" aria-labelledby="etc-title">
      <h2 id="etc-title">서비스 정보</h2>
      <ul class="link-list">
        <li><a href="/support/index.html">고객센터</a></li>
        <li><span class="link-disabled">이용약관 (준비 중)</span></li>
        <li><span class="link-disabled">개인정보 처리방침 (준비 중)</span></li>
        <li><span class="link-disabled danger">회원 탈퇴 (준비 중)</span></li>
      </ul>
    </section>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/settings.js"></script>
</body>
</html>
